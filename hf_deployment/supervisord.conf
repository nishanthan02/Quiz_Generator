[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=1000

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:redis]
command=redis-server
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data --console-address ":9001"
environment=MINIO_ROOT_USER="minioadmin",MINIO_ROOT_PASSWORD="minioadmin"
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=python -m uvicorn main:app --host 0.0.0.0 --port 7860
autorestart=true
priority=10
environment=REDIS_URL="redis://localhost:6379/0",MINIO_ENDPOINT="localhost:9000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-documents]
command=python -m celery -A core.celery_app worker -Q documents --pool=threads --concurrency=4 --loglevel=info
autorestart=true
priority=20
environment=REDIS_URL="redis://localhost:6379/0",MINIO_ENDPOINT="localhost:9000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-quizzes]
command=python -m celery -A core.celery_app worker -Q quizzes --pool=threads --concurrency=4 --loglevel=info
autorestart=true
priority=20
environment=REDIS_URL="redis://localhost:6379/0",MINIO_ENDPOINT="localhost:9000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
